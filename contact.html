<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Sayyed Rihan Akhil</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#070b18;
    color:#fff;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    width:400px;
    height:400px;
    background:#00eaff;
    border-radius:50%;
    filter:blur(120px);
    opacity:.16;
    left:-150px;
    top:-100px;
    z-index:-1;
}

body::after{
    content:"";
    position:fixed;
    width:400px;
    height:400px;
    background:#8b5cf6;
    border-radius:50%;
    filter:blur(120px);
    opacity:.16;
    right:-150px;
    bottom:-100px;
    z-index:-1;
}

.container{
    width:90%;
    max-width:1100px;
    margin:auto;
    padding:80px 0;
}

.heading{
    text-align:center;
    margin-bottom:50px;
}

.heading span{
    color:#00eaff;
    letter-spacing:3px;
    font-size:14px;
}

.heading h1{
    font-size:48px;
    margin:12px 0;
}

.heading h1 b{
    background:linear-gradient(90deg,#00eaff,#9b5cff);
    -webkit-background-clip:text;
    color:transparent;
}

.heading p{
    color:#aeb8ca;
}

.contact-box{
    display:grid;
    grid-template-columns:1fr 1.3fr;
    gap:25px;
}

.info,
.form{
    padding:35px;
    border-radius:25px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(15px);
    box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.info h2{
    font-size:28px;
    margin-bottom:12px;
}

.info > p{
    color:#aeb8ca;
    line-height:1.7;
    margin-bottom:30px;
}

.item{
    display:flex;
    align-items:center;
    gap:16px;
    padding:16px;
    margin:13px 0;
    border-radius:17px;
    background:rgba(255,255,255,.05);
    transition:.3s;
}

.item:hover{
    transform:translateX(7px);
    border:1px solid rgba(0,234,255,.3);
}

.item-icon{
    width:48px;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:14px;
    background:linear-gradient(135deg,#00eaff,#7c3aed);
    font-size:21px;
}

.item small{
    display:block;
    color:#8490a6;
    margin-bottom:4px;
}

.item strong{
    color:#fff;
}

.form h2{
    font-size:28px;
    margin-bottom:25px;
}

input,
textarea{
    width:100%;
    padding:16px 18px;
    margin-bottom:18px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(0,0,0,.2);
    color:#fff;
    outline:none;
    transition:.3s;
}

input:focus,
textarea:focus{
    border-color:#00eaff;
    box-shadow:0 0 15px rgba(0,234,255,.12);
}

textarea{
    height:150px;
    resize:none;
}

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:14px;
    background:linear-gradient(90deg,#00eaff,#7c3aed);
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(0,234,255,.2);
}

.links{
    display:flex;
    gap:12px;
    margin-top:25px;
}

.links a{
    flex:1;
    text-align:center;
    padding:13px;
    border-radius:12px;
    text-decoration:none;
    color:#fff;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.1);
    transition:.3s;
}

.links a:hover{
    border-color:#00eaff;
    color:#00eaff;
}

@media(max-width:750px){

    .heading h1{
        font-size:35px;
    }

    .contact-box{
        grid-template-columns:1fr;
    }

    .info,
    .form{
        padding:25px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="heading">
        <span>GET IN TOUCH</span>
        <h1>Contact <b>Me</b></h1>
        <p>Let's connect and discuss your next project</p>
    </div>

    <div class="contact-box">

        <div class="info">

            <h2>Let's Talk</h2>

            <p>
                Have a project idea or want to connect?
                Feel free to contact me through the details below.
            </p>

            <div class="item">
                <div class="item-icon">📱</div>
                <div>
                    <small>Phone</small>
                    <strong>9130016692</strong>
                </div>
            </div>

            <div class="item">
                <div class="item-icon">💬</div>
                <div>
                    <small>WhatsApp</small>
                    <strong>Available on WhatsApp</strong>
                </div>
            </div>

            <div class="item">
                <div class="item-icon">🎓</div>
                <div>
                    <small>Education</small>
                    <strong>B.Sc Software Engineering</strong>
                </div>
            </div>

            <div class="links">
                <a href="tel:9130016692">📞 Call</a>
                <a href="https://wa.me/919130016692" target="_blank">💬 WhatsApp</a>
            </div>

        </div>

        <div class="form">

            <h2>Send Message</h2>

            <form onsubmit="sendMessage(event)">

                <input type="text" id="name"
                       placeholder="Your Name" required>

                <input type="email" id="email"
                       placeholder="Your Email" required>

                <input type="text" id="subject"
                       placeholder="Subject" required>

                <textarea id="message"
                          placeholder="Your Message"
                          required></textarea>

                <button type="submit">
                    Send Message 🚀
                </button>

            </form>

        </div>

    </div>

</div>

<script>
function sendMessage(e){

    e.preventDefault();

    let name = document.getElementById("name").value;
    let subject = document.getElementById("subject").value;
    let message = document.getElementById("message").value;

    let text =
        "Hello Sayyed Rihan Akhil,%0A%0A" +
        "Name: " + encodeURIComponent(name) + "%0A" +
        "Subject: " + encodeURIComponent(subject) + "%0A" +
        "Message: " + encodeURIComponent(message);

    window.open(
        "https://wa.me/919130016692?text=" + text,
        "_blank"
    );
}
</script>

</body>
</html>
